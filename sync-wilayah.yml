name: Sinkronisasi data kode pos Indonesia
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run sync:postal
      - name: Simpan data terbaru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post.js
          git diff --cached --quiet || git commit -m "chore: sync postal code Indonesia"
          git push
